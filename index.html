<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="author" content="eldermoor-dev">
<meta name="description" content="Die Schatten von Eldermoor – Retro-Dungeon-Crawler (Prototyp)">
<meta name="theme-color" content="#0b0907">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Die Schatten von Eldermoor</title>
<style>
:root{--fs:1;--hs:1;--b:54px;--hp-good:#6fbf5a;--hp-bad:#d24b3c;--amber:#d9a441;--ink:#e8dcc0;--panel:rgba(14,11,8,.84);--line:#6b5630}
body.cb{--hp-good:#4aa3ff;--hp-bad:#ff9f1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:var(--ink);
  font:calc(14px*var(--fs)) system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:480px;height:270px;background:#000}
#view{display:block;width:100%;height:100%;image-rendering:pixelated}
#view.hit{animation:hit .2s ease-out}
@keyframes hit{0%{filter:brightness(2.4) saturate(1.6)}100%{filter:none}}
#hud{position:absolute;inset:0;pointer-events:none}
#fps{position:fixed;left:calc(env(safe-area-inset-left,0px) + 4px);top:calc(env(safe-area-inset-top,0px) + 44px);z-index:7;pointer-events:none;font:10px/1.25 monospace;white-space:pre;background:#000a;padding:2px 5px;border-radius:3px;color:#9f9}
#enemybox{zoom:var(--hs,1);position:absolute;left:6px;top:calc(44px / var(--hs,1));width:min(36%,300px);background:rgba(14,11,8,.62);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.78rem}
#enemybox .en{display:flex;gap:8px;align-items:center}
#enemybox .en .bar{flex:1}
#enemybox{pointer-events:auto}
#enemybox .en{cursor:pointer;padding:4px 6px;min-height:30px;box-sizing:border-box;touch-action:manipulation;border-radius:4px;border:1px solid transparent;flex-wrap:wrap}
#enemybox .en.sel{border-color:var(--amber);background:rgba(217,164,65,.12)}
#enemybox .en.dead{opacity:.35;text-decoration:line-through;cursor:default}
#enemybox .heavywarn{background:#8f1f12;border:1px solid #ff9d5c;color:#fff;font-weight:700;text-align:center;border-radius:5px;padding:5px 6px;margin:3px 0;font-size:.8rem;animation:hw 0.9s ease-in-out infinite}
@keyframes hw{0%,100%{background:#8f1f12}50%{background:#c9371f}}
#actionbar .ab.pulse{background:#6b2a14;border-color:#ff9d5c;box-shadow:0 0 10px #ff9d5c;font-weight:700;animation:hwb 0.9s ease-in-out infinite}
@keyframes hwb{0%,100%{box-shadow:0 0 4px #ff9d5c}50%{box-shadow:0 0 14px #ff9d5c}}
@media (prefers-reduced-motion:reduce){#enemybox .heavywarn,#actionbar .ab.pulse{animation:none}}
#enemybox .en .warn{flex:1 0 100%;font-style:normal;color:#ff9d5c;font-size:.72rem}
.order{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap;font-size:.64rem}
.order span{padding:1px 6px;border-radius:9px;background:#2a2116;border:1px solid #4a3c26}
.order span.now{background:var(--amber);color:#1b1208;border-color:var(--amber);font-weight:700}
.order span.done{opacity:.4}
.order span.foe{border-color:#7a3a30}
#stack{zoom:var(--hs,1);position:absolute;left:50%;bottom:calc(4px / var(--hs,1));transform:translateX(-50%);width:min(62%,540px);display:flex;flex-direction:column;gap:4px}
#log{text-align:center;font-size:.84rem;text-shadow:0 1px 2px #000,0 0 5px #000}
#log div{background:rgba(0,0,0,.42);border-radius:4px;padding:1px 6px;margin-top:2px}
#actionbar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
#actionbar .ab{flex:1 1 auto;min-height:36px;padding:0 6px;border-radius:8px;background:rgba(42,33,22,.92);border:1px solid var(--amber);font-size:.78rem;white-space:nowrap}
#actionbar .ab[disabled]{opacity:.4;border-color:#5a4a30}
#actionbar .wait{padding:8px;font-size:.84rem;background:var(--panel);border-radius:6px}
#party{display:flex;gap:4px;pointer-events:auto} /* #hud hat pointer-events:none – ohne auto kommen Tipps auf die Heldenkarten nie an (Fehler bis 0.16.3) */
.card{cursor:pointer;flex:1;min-width:0;background:var(--panel);border:1px solid #5a4a30;border-radius:5px;padding:3px;display:flex;gap:4px;align-items:center}
.card canvas{width:32px;height:32px;image-rendering:pixelated;flex:none;border-radius:3px}
.card .nm{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rw{opacity:.7}
.card .hp{font-size:.66rem;opacity:.85}
.card.act{outline:2px solid var(--amber)}
.card.dead{opacity:.45;filter:grayscale(1)}
.bar{height:6px;background:#2b241a;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hp-good)}
.bar.low>i{background:var(--hp-bad)}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);display:grid;grid-template-columns:repeat(3,var(--b));grid-auto-rows:var(--b);gap:5px;z-index:5}
#ctl-left{left:calc(env(safe-area-inset-left,0px) + 6px)}
#ctl-right{right:calc(env(safe-area-inset-right,0px) + 6px)}
.btn{background:rgba(20,15,10,.62);border:1.5px solid rgba(217,164,65,.7);border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:20px;line-height:1;touch-action:none;padding:0}
.btn small{font-size:calc(8px*var(--fs));white-space:nowrap;margin-top:3px;opacity:.9;letter-spacing:0}
.btn.down{background:rgba(217,164,65,.5)}
#event{position:fixed;left:0;right:0;top:22%;z-index:9;text-align:center;padding:10px 12px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(8,6,4,.82) 18%,rgba(8,6,4,.82) 82%,transparent)}
#event b{display:block;font-size:calc(22px*var(--fs));letter-spacing:.08em;color:var(--amber);text-transform:uppercase}
#event span{display:block;margin-top:4px;font-size:calc(13px*var(--fs));font-style:italic;color:var(--ink)}
#event.show{animation:evt 3.4s ease-out forwards}
@keyframes evt{0%{opacity:0;transform:scaleY(.6)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#event[hidden]{display:none}
#compass{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;background:rgba(14,11,8,.6);border:1.5px solid rgba(217,164,65,.7);overflow:hidden;pointer-events:none}
#compass-dial{position:absolute;inset:0;transition:transform .25s ease-out}
#compass-dial b{transition:transform .25s ease-out;position:absolute;font-size:11px;color:var(--ink);width:14px;text-align:center;left:15px;top:15px;font-weight:600}
#compass-dial b.n{transform:translateY(-14px) rotate(var(--cr,0deg));color:#e0604c}
#compass-dial b.o{transform:translateX(14px) rotate(var(--cr,0deg))}
#compass-dial b.s{transform:translateY(14px) rotate(var(--cr,0deg))}
#compass-dial b.w{transform:translateX(-14px) rotate(var(--cr,0deg))}
#compass i{position:absolute;left:50%;top:1px;margin-left:-4px;border:4px solid transparent;border-top:6px solid var(--amber);border-bottom:0}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.3),rgba(0,0,0,.88));text-align:center;padding:8px}
#title h1{margin:0;font:700 clamp(1.5rem,8vh,2.8rem) Georgia,"Times New Roman",serif;letter-spacing:.08em;color:#f0dca8;text-shadow:0 0 14px #a5651a,0 2px 3px #000}
#title .sub{font-size:.82rem;opacity:.8;margin-bottom:4px}
#title .menu{display:grid;grid-template-columns:repeat(2,minmax(150px,200px));gap:8px}
.mb{min-height:44px;padding:6px 14px;border-radius:8px;background:#2a2116;border:1px solid var(--line);cursor:pointer}
.mb:active{background:#4a3a20}
.mb.primary{background:#5a3f12;border-color:var(--amber)}
.mb[disabled]{opacity:.4}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:8px}
#modal[hidden],#title[hidden],#banner[hidden],#toast[hidden],#fps[hidden],#enemybox[hidden],#actionbar[hidden]{display:none}
#modal-box{background:#17120d;border:2px solid var(--line);border-radius:10px;width:min(94vw,640px);max-height:100%;overflow:auto;padding:12px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#modal-box h2{margin:0 0 8px;font:700 1.15rem Georgia,serif;color:#f0dca8}
#modal-box h3{margin:10px 0 4px;font-size:.95rem;color:var(--amber)}
#modal-box p,#modal-box li{line-height:1.4}
#modal-box .row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2f2618;flex-wrap:wrap}
#modal-box .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#modal-box .muted{opacity:.7;font-size:.85rem}
#modal-box .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
#modal-box .hc{background:#211a11;border:1px solid #4a3c26;border-radius:6px;padding:8px}
#modal-box select,#modal-box input[type=range],#modal-box input[type=text]{min-height:36px;background:#2a2116;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
#modal-box input[type=text]{width:100%;min-width:0;padding:0 8px;margin-top:4px;-webkit-user-select:text;user-select:text}
#modal-box .mapbar{margin-top:4px;flex-wrap:nowrap;align-items:center;justify-content:space-between}
#modal-box .speech{text-align:center;margin:4px 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#211a11}
#modal-box .speech b{display:block;color:var(--amber);font:700 1.05rem Georgia,serif;letter-spacing:.05em;margin-bottom:4px}
#modal-box .speech p{margin:0;font:italic 1.2rem/1.4 Georgia,serif;color:#f0dca8}
#modal-box .headbtn{display:flex;align-items:center;gap:8px;text-align:left}
#modal-box .headbtn img{width:44px;height:44px;image-rendering:pixelated;border-radius:4px;flex:none}
#modal-box .row.nw{flex-wrap:nowrap}
#modal-box .row.nw>div:first-child{flex:1 1 auto;min-width:0}
#modal-box .row.nw>button{flex:none;white-space:nowrap;min-width:8.5em}
#modal-box .ic{display:inline-block;width:1.4em;text-align:center}
#modal-box .hc .row{padding:4px 0}
#modal-box .stats{display:flex;flex-wrap:wrap;gap:2px 12px}
#modal-box .hc .top{display:flex;gap:8px;align-items:center}
#modal-box .pv{width:56px;height:56px;flex:none;image-rendering:pixelated;border-radius:4px;border:1px solid #4a3c26}
#modal-box .qp{display:flex;gap:8px;align-items:center;padding:4px 0}
#modal-box .qp canvas{width:40px;height:40px;flex:none;image-rendering:pixelated;border-radius:3px}
#modal-box input[type=checkbox]{width:22px;height:22px}
.ok{color:#8fd48a}.bad{color:#ff8a7a}
#modal-box[data-kind=map]{width:min(96vw,920px)}
#modal-box .mapwrap{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#modal-box .mapleg{flex:0 0 150px;display:grid;gap:2px 6px;font-size:.72rem;line-height:1.15;max-height:calc(100dvh - 120px);overflow:auto;touch-action:pan-y}
#modal-box .mapleg div{display:flex;gap:5px;align-items:center}
#modal-box .mapleg.two{flex-basis:290px;grid-template-columns:1fr 1fr}
#modal-box .mapwrap #mapcv{max-width:calc(100% - 160px)}
#modal-box .mapwrap .mapleg.two~#mapcv,#modal-box .mapwrap:has(.two) #mapcv{max-width:calc(100% - 300px)}
@media (max-width:520px){#modal-box .mapwrap #mapcv{max-width:100%}}
#modal-box .mapleg canvas{width:16px;height:16px;flex:none;background:#0a0806;border-radius:2px}
#mapcv{display:block;margin:4px 0;min-width:0;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 120px);image-rendering:pixelated;border:1px solid var(--line);background:#0a0806}
#banner{position:fixed;top:0;left:0;right:0;z-index:40;background:#4a3410;padding:8px;display:flex;gap:10px;justify-content:center;align-items:center;font-size:.85rem}
#toast{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:45;background:rgba(0,0,0,.85);border:1px solid var(--amber);border-radius:8px;padding:8px 14px;max-width:80vw;text-align:center;font-size:.88rem}
#portrait-warn{display:none;position:fixed;inset:0;z-index:60;background:#000;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.1rem}
.turnbar{text-align:center;font-weight:700;font-size:.86rem;padding:2px 6px;border-radius:5px;margin-bottom:3px}
.turnbar.hero{background:var(--amber);color:#1b1208}
.turnbar.foe{background:#7a3a30;color:#fff}
.clog{max-height:60vh;overflow:auto;touch-action:pan-y}
.clog .cl{padding:3px 0;border-bottom:1px solid #2f2618;line-height:1.35}
.clog .rd{font-weight:700;color:var(--amber);margin-top:8px;border-bottom:2px solid var(--line)}
.clog .turn{color:#f0dca8;opacity:.85}
body.on-title .pad,body.on-title #hud,body.on-title #fps{visibility:hidden}
@media (orientation:portrait){#portrait-warn{display:flex}}
@media (max-height:340px){:root{--b:46px}}

#modal-box[data-kind=talents]{width:min(96vw,980px)}.mb.sel{border-color:#e0b040;color:#e0b040}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.tnode{display:flex;flex-direction:column;gap:2px;text-align:left;padding:5px 7px;border:1px solid #5a4a30;border-radius:6px;background:#1c160e;color:#e8dcc0;font-size:.78em;min-height:0}
.tnode span{color:#b8a888;font-size:.92em}.tnode em{font-style:normal;color:#9a8a68}
.tnode.can{border-color:#e0b040;background:#2a2010}.tnode.can em{color:#e0b040}
.tnode.got{border-color:#7fa05a;background:#18220f}.tnode.got em{color:#9fc27a}
.tnode:disabled:not(.got){opacity:.55}
@media (max-width:640px){.tgrid{grid-template-columns:1fr}}
#enemybox .en .combo{flex:1 0 100%;font-style:normal;color:#7fd4ff;font-size:.72rem}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="480" height="270"></canvas>
  <div id="hud">
    <div id="compass" aria-hidden="true"><div id="compass-dial"><b class="n">N</b><b class="o">O</b><b class="s">S</b><b class="w">W</b></div><i></i></div>
    <div id="enemybox" hidden></div>
    <div id="stack">
      <div id="log"></div>
      <div id="actionbar" hidden></div>
      <div id="party"></div>
    </div>
  </div>
</div>


<div id="fps" hidden></div>

<div id="ctl-left" class="pad">
  <button class="btn" data-a="tl">↶<small>Links drehen</small></button>
  <button class="btn" data-a="fwd">↑<small>Vor</small></button>
  <button class="btn" data-a="tr">↷<small>Rechts drehen</small></button>
  <button class="btn" data-a="sl">←<small>Seitwärts</small></button>
  <button class="btn" data-a="back">↓<small>Zurück</small></button>
  <button class="btn" data-a="sr">→<small>Seitwärts</small></button>
</div>
<div id="ctl-right" class="pad">
  <button class="btn" data-a="attack">⚔<small>Angriff</small></button>
  <button class="btn" data-a="cast">✦<small>Fähigkeit</small></button>
  <button class="btn" data-a="interact">◉<small>Interagieren</small></button>
  <button class="btn" data-a="inv">▣<small>Inventar</small></button>
  <button class="btn" data-a="char">☻<small>Charakter</small></button>
  <button class="btn" data-a="menu">☰<small>Menü</small></button>
</div>

<div id="title" hidden>
  <h1>Die Schatten von Eldermoor</h1>
  <div class="sub" id="ver"></div>
  <div class="menu">
    <button class="mb primary" data-t="new">Neues Spiel</button>
    <button class="mb" data-t="continue" id="btn-continue" disabled>Fortsetzen</button>
    <button class="mb" data-t="load">Spielstände</button>
    <button class="mb" data-t="settings">Einstellungen</button>
    <button class="mb" data-t="help">Steuerung &amp; Info</button>
  </div>
</div>

<div id="modal" hidden><div id="modal-box"></div></div>
<div id="event" hidden><b></b><span></span></div>
<div id="banner" hidden></div>
<div id="toast" hidden></div>
<div id="portrait-warn">Bitte das Gerät ins Querformat drehen.</div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script type="module" src="main.js"></script>
</body>
</html>
